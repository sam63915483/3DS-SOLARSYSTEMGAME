<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SK-1 Clone — 3DS mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell" id="shell">
  <div class="half top"><canvas id="top" width="400" height="240"></canvas></div>
  <div class="hinge"></div>
  <div class="half bottom"><canvas id="bottom" width="320" height="240"></canvas></div>
</div>
<p class="hint">Bottom screen is the touch screen (single touch, like the real 3DS). 3DS buttons: arrow keys = D-pad, Z or Enter = A, X or Backspace = B, WASD = circle pad (W/S bend pitch, A/D sweep filters). A USB gamepad works too. Desktop shortcuts: Space = REC/STOP, + / − = zoom.</p>
<script type="module" src="app.js"></script>
</body>
</html>
